onboarding = false

[theme]
name = "catppuccin"

[ui]
agent_panel_scope = "all"
show_agent_labels_on_pane_borders = true

[ui.toast]
delivery = "herdr"

[experimental]
switch_ascii_input_source_in_prefix = false

[keys]
focus_agent = "prefix+alt+1..9"
last_pane = "prefix+/"
prefix = "ctrl+a"
split_vertical = "prefix+|"
toggle_sidebar = "prefix+a"
open_notification_target = "prefix+o"

[[keys.command]]
key = "prefix+alt+g"
type = "pane"
command = "lazygit"
description = "run lazygit"

[[keys.command]]
key = "prefix+space"
type = "shell"
command = "notify-jump"
description = "saltar para o ultimo alerta unread"

[[keys.command]]
key = "prefix+shift+space"
type = "pane"
command = "notify-pick"
description = "picker de notificacoes"
